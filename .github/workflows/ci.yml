name: DevOne CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devone-qa-evidence
          path: qa-reports/*.json
          if-no-files-found: error
          retention-days: 30

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n installer/install.sh
      - run: bash -n installer/install-legacy.sh
      - run: bash -n scripts/provision-vault-key.sh
      - run: bash -n deploy/certbot/devone-nginx.sh
      - run: python3 scripts/verify-distribution.py
      - run: test -f deploy/nginx/devone-panel.conf.template
      - run: test -f deploy/systemd/devone-api.service
      - run: test -f deploy/systemd/devone-agent.service
